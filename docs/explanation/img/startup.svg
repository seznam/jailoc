<text x="743" y="124" fill="#6E7180" font-size="12">build and export</text>
<text x="743" y="144" fill="#464C54" font-size="12.5">host Docker or builder VM,</text>
<text x="743" y="163" fill="#464C54" font-size="12.5">unpacked into image cache</text>
