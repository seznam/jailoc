<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="536" viewBox="0 0 1200 536" font-family="Inter,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">jailoc up startup sequence</title>
<desc id="d">jailoc up loads the config, resolves the workspace, unpacks the embedded VM runtime, builds and exports the image, and starts a detached supervisor that runs the network broker and boots the VM. Inside the VM, jailoc-guest sets up the root file system and shares and starts the SSH server; jailoc then delivers secrets over SSH and sessions run the agent.</desc>
