<text x="26" y="61" fill="#D24E00" font-size="12" font-weight="800" letter-spacing="0.08em">HOST</text>
<rect x="30" y="84" width="214" height="96" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="94" width="3" height="76" rx="1.5" fill="#D24E00"/>
<text x="44" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">1 config</text>
<text x="44" y="124" fill="#6E7180" font-size="12">load and validate</text>
<text x="44" y="144" fill="#464C54" font-size="12.5">config.toml, written with</text>
<text x="44" y="163" fill="#464C54" font-size="12.5">defaults on first run</text>
<rect x="263" y="84" width="214" height="96" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="263" y="94" width="3" height="76" rx="1.5" fill="#D24E00"/>
<text x="277" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">2 resolve</text>
<text x="277" y="124" fill="#6E7180" font-size="12">workspace</text>
<text x="277" y="144" fill="#464C54" font-size="12.5">paths, mounts, snapshots,</text>
<text x="277" y="163" fill="#464C54" font-size="12.5">allow lists, secrets, size</text>
<rect x="496" y="84" width="214" height="96" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="496" y="94" width="3" height="76" rx="1.5" fill="#D24E00"/>
<text x="510" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">3 runtime</text>
<text x="510" y="124" fill="#6E7180" font-size="12">embedded VM runtime</text>
<text x="510" y="144" fill="#464C54" font-size="12.5">runner, libkrun, libkrunfw</text>
<text x="510" y="163" fill="#464C54" font-size="12.5">unpacked into the cache</text>
