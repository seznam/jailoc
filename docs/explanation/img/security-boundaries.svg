<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" font-family="Inter,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">jailoc trust boundaries</title>
<desc id="d">The host side (jailoc CLI, network broker, VMM process confined by Landlock on Linux, host files) is trusted. The workspace VM (coding agent, guest root, guest kernel) is untrusted. Only virtio devices cross the VM boundary: virtio-fs shares limited to declared directories and one virtio-net link whose only peer is the network broker, which applies the egress policy. The CLI reaches the guest over SSH through the broker's socket.</desc>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9AA6B8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#425CC7"/></marker></defs>
<rect width="1200" height="512" fill="#FFFFFF" stroke="#DCE0E5" rx="8"/>
<text x="16" y="27" fill="#24292E" font-size="16" font-weight="700">Trust boundaries — one workspace</text>
<text x="1184" y="27" fill="#9AA6B8" font-size="12" font-weight="700" text-anchor="end">external</text>
<rect x="1109" y="18" width="9" height="9" rx="2" fill="#9AA6B8"/>
<text x="1092" y="27" fill="#425CC7" font-size="12" font-weight="700" text-anchor="end">third party</text>
<rect x="996" y="18" width="9" height="9" rx="2" fill="#425CC7"/>
<text x="979" y="27" fill="#8250DF" font-size="12" font-weight="700" text-anchor="end">untrusted guest</text>
<rect x="854" y="18" width="9" height="9" rx="2" fill="#8250DF"/>
<text x="837" y="27" fill="#D24E00" font-size="12" font-weight="700" text-anchor="end">jailoc on the host</text>
<rect x="690" y="18" width="9" height="9" rx="2" fill="#D24E00"/>
<rect x="8" y="44" width="1184" height="264" fill="#FFF1E6" rx="6"/>
<rect x="8" y="44" width="6" height="264" fill="#D24E00" rx="3"/>
<text x="26" y="61" fill="#D24E00" font-size="12" font-weight="800" letter-spacing="0.08em">HOST · TRUSTED</text>
<rect x="30" y="84" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="94" width="3" height="70" rx="1.5" fill="#D24E00"/>
<text x="44" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc</text>
<text x="44" y="124" fill="#6E7180" font-size="12">CLI: up, shell, reload</text>
<text x="44" y="144" fill="#464C54" font-size="12.5">attaches sessions</text>
<rect x="290" y="84" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="290" y="94" width="3" height="70" rx="1.5" fill="#D24E00"/>
<text x="304" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc-netbroker</text>
<text x="304" y="124" fill="#6E7180" font-size="12">userspace network stack · policy</text>
<rect x="304" y="142" width="80" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="344" y="156" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">SSH socket</text>
<rect x="392" y="142" width="101" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="442.5" y="156" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">ssh_auth_sock</text>
<rect x="501" y="142" width="80" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="541" y="156" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">host_ports</text>
<rect x="920" y="84" width="260" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5" stroke-dasharray="5 4"/>
<rect x="920" y="94" width="3" height="70" rx="1.5" fill="#9AA6B8"/>
<text x="934" y="106" fill="#9AA6B8" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">Internet</text>
<text x="934" y="124" fill="#6E7180" font-size="12">public destinations</text>
<text x="934" y="144" fill="#464C54" font-size="12.5">private ranges denied by default</text>
<rect x="600" y="200" width="280" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
