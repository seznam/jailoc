<rect x="695" y="258" width="80" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="735" y="272" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">virtio-net</text>
<rect x="920" y="200" width="260" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5" stroke-dasharray="5 4"/>
<rect x="920" y="210" width="3" height="70" rx="1.5" fill="#9AA6B8"/>
<text x="934" y="222" fill="#9AA6B8" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">host files</text>
<text x="934" y="240" fill="#6E7180" font-size="12">declared paths and mounts</text>
<text x="934" y="260" fill="#464C54" font-size="12.5">read-only shares enforced here</text>
<path d="M590 129 L912 129" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="680" y="121" fill="#6E7180" font-size="11">policy-checked egress</text>
<path d="M880 245 L912 245" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<path d="M130 174 C130 250 330 250 380 178" fill="none" stroke="#425CC7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ab)"/>
<rect x="92" y="241" width="196" height="18" rx="9" fill="#FFFFFF" stroke="#425CC7"/>
<text x="190" y="254" fill="#425CC7" font-size="11" font-weight="600" text-anchor="middle">SSH over the broker's socket</text>
<line x1="8" y1="328" x2="1192" y2="328" stroke="#425CC7" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="865" y="318" width="290" height="20" rx="10" fill="#425CC7"/>
<text x="1010" y="332.5" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">VM boundary · only virtio devices cross</text>
<rect x="8" y="348" width="1184" height="148" fill="#EEF8EC" rx="6"/>
<rect x="8" y="348" width="6" height="148" fill="#2E7D32" rx="3"/>
<text x="26" y="365" fill="#2E7D32" font-size="12" font-weight="800" letter-spacing="0.08em">WORKSPACE VM · UNTRUSTED</text>
<rect x="30" y="392" width="1150" height="84" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="402" width="3" height="64" rx="1.5" fill="#8250DF"/>
<text x="44" y="414" fill="#8250DF" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">coding agent · guest root · guest kernel</text>
<text x="44" y="432" fill="#6E7180" font-size="12">everything inside the VM, including jailoc-guest, is treated as hostile</text>
<text x="44" y="452" fill="#464C54" font-size="12.5">the host treats everything it reads back from the VM as untrusted data</text>
<path d="M440 392 L440 178" fill="none" stroke="#425CC7" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="450" y="374" fill="#425CC7" font-size="11" font-weight="600">virtio-net · only peer is the broker</text>
<path d="M740 392 L740 294" fill="none" stroke="#425CC7" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="750" y="374" fill="#425CC7" font-size="11" font-weight="600">virtio-fs · declared directories only</text>
</svg>
