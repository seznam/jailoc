<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Inter,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Secret delivery</title>
<desc id="d">jailoc reads every secret source on the host (from_env, from_file, from_command) before it boots the VM or applies a reload, then sends the values with the workspace env entries as one payload over SSH, which the network broker forwards into the VM. In the guest, jailoc-guest writes file secrets to /run/secrets on a tmpfs and env entries to an in-memory environment file; sessions of the coding agent load both. Nothing is written to host disk, and the process log replaces secret values of eight or more characters with [redacted].</desc>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9AA6B8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#425CC7"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D24E00"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF" stroke="#DCE0E5" rx="8"/>
<text x="16" y="27" fill="#24292E" font-size="16" font-weight="700">Secrets · read on the host, kept in guest memory</text>
<text x="1184" y="27" fill="#8250DF" font-size="12" font-weight="700" text-anchor="end">agent</text>
<rect x="1131" y="18" width="9" height="9" rx="2" fill="#8250DF"/>
<text x="1114.0" y="27" fill="#2E7D32" font-size="12" font-weight="700" text-anchor="end">jailoc in the VM</text>
<rect x="982" y="18" width="9" height="9" rx="2" fill="#2E7D32"/>
<text x="964.8" y="27" fill="#D24E00" font-size="12" font-weight="700" text-anchor="end">jailoc on the host</text>
<rect x="818" y="18" width="9" height="9" rx="2" fill="#D24E00"/>
<text x="801.1999999999999" y="27" fill="#9AA6B8" font-size="12" font-weight="700" text-anchor="end">sources on the host</text>
<rect x="647" y="18" width="9" height="9" rx="2" fill="#9AA6B8"/>
<rect x="8" y="44" width="1184" height="160" fill="#FFF1E6" rx="6"/>
<rect x="8" y="44" width="6" height="160" fill="#D24E00" rx="3"/>
<text x="26" y="61" fill="#D24E00" font-size="12" font-weight="800" letter-spacing="0.08em">HOST</text>
<text x="1176" y="61" fill="#6E7180" font-size="11.5" text-anchor="end">values never reach host disk, the image, a share or a snapshot</text>
<rect x="30" y="84" width="300" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5" stroke-dasharray="5 4"/>
<rect x="30" y="94" width="3" height="80" rx="1.5" fill="#9AA6B8"/>
<text x="44" y="106" fill="#9AA6B8" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">secret sources</text>
<text x="44" y="124" fill="#6E7180" font-size="12">named in config.toml, never the value</text>
<rect x="44" y="130" width="71" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="79.5" y="144" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">from_env</text>
<rect x="123" y="130" width="79" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="162.5" y="144" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">from_file</text>
<rect x="210" y="130" width="101" height="20" rx="4" fill="#EEF1FB" stroke="#C9D1F0"/>
<text x="260.5" y="144" fill="#425CC7" font-size="11.5" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,Menlo,monospace">from_command</text>
<rect x="410" y="84" width="320" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="410" y="94" width="3" height="80" rx="1.5" fill="#D24E00"/>
<text x="424" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc up · reload</text>
<text x="424" y="124" fill="#6E7180" font-size="12">reads every source first</text>
<text x="424" y="144" fill="#464C54" font-size="12.5">a failing source stops</text>
<text x="424" y="163" fill="#464C54" font-size="12.5">before anything changes</text>
<rect x="810" y="84" width="360" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="810" y="94" width="3" height="80" rx="1.5" fill="#D24E00"/>
<text x="824" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc-netbroker</text>
<text x="824" y="124" fill="#6E7180" font-size="12">forwards SSH into the VM</text>
<text x="824" y="144" fill="#464C54" font-size="12.5">one payload: secrets</text>
<text x="824" y="163" fill="#464C54" font-size="12.5">and the workspace env entries</text>
<path d="M332 134 L404 134" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="368" y="126" fill="#6E7180" font-size="11" text-anchor="middle">read</text>
<path d="M732 134 L804 134" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="768" y="126" fill="#6E7180" font-size="11" text-anchor="middle">SSH</text>
<line x1="8" y1="224" x2="1192" y2="224" stroke="#425CC7" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="548" y="214" width="103" height="20" rx="10" fill="#425CC7"/>
<text x="600" y="228" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">VM boundary</text>
<rect x="8" y="244" width="1184" height="280" fill="#EEF8EC" rx="6"/>
<rect x="8" y="244" width="6" height="280" fill="#2E7D32" rx="3"/>
<text x="26" y="261" fill="#2E7D32" font-size="12" font-weight="800" letter-spacing="0.08em">WORKSPACE VM · GUEST MEMORY ONLY</text>
<rect x="810" y="284" width="360" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="810" y="294" width="3" height="80" rx="1.5" fill="#2E7D32"/>
<text x="824" y="306" fill="#2E7D32" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc-guest</text>
<text x="824" y="324" fill="#6E7180" font-size="12">writes the payload</text>
<text x="824" y="344" fill="#464C54" font-size="12.5">process log: values of 8+ characters</text>
<text x="824" y="363" fill="#464C54" font-size="12.5">become [redacted]</text>
<path d="M990 186 L990 281" fill="none" stroke="#425CC7" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="998" y="262" fill="#425CC7" font-size="11" font-weight="600">virtio-net</text>
<rect x="410" y="284" width="320" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="410" y="294" width="3" height="80" rx="1.5" fill="#2E7D32"/>
<text x="424" y="306" fill="#2E7D32" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">/run/secrets/NAME</text>
<text x="424" y="324" fill="#6E7180" font-size="12">file secrets · tmpfs</text>
<text x="424" y="344" fill="#464C54" font-size="12.5">mode 0400, owned by agent</text>
<text x="424" y="363" fill="#464C54" font-size="12.5">new value visible at once</text>
<rect x="410" y="404" width="320" height="100" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="410" y="414" width="3" height="80" rx="1.5" fill="#2E7D32"/>
<text x="424" y="426" fill="#2E7D32" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">environment file</text>
<text x="424" y="444" fill="#6E7180" font-size="12">env secrets and env entries</text>
<text x="424" y="464" fill="#464C54" font-size="12.5">in memory, loaded by</text>
<text x="424" y="483" fill="#464C54" font-size="12.5">every new session</text>
<path d="M808 334 L736 334" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<path d="M808 354 Q770 354 770 400 Q770 454 736 454" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="30" y="284" width="300" height="220" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="294" width="3" height="200" rx="1.5" fill="#8250DF"/>
<text x="44" y="306" fill="#8250DF" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">coding agent</text>
<text x="44" y="324" fill="#6E7180" font-size="12">runs as agent in sessions</text>
<text x="44" y="344" fill="#464C54" font-size="12.5">reads every file secret</text>
<text x="44" y="363" fill="#464C54" font-size="12.5">and env secret it is given</text>
<text x="44" y="382" fill="#464C54" font-size="12.5"></text>
<text x="44" y="401" fill="#464C54" font-size="12.5">running sessions keep the</text>
<text x="44" y="420" fill="#464C54" font-size="12.5">environment they started with</text>
