<rect x="900" y="584" width="3" height="60" rx="1.5" fill="#9AA6B8"/>
<text x="914" y="596" fill="#9AA6B8" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">dns_upstream</text>
<text x="914" y="614" fill="#6E7180" font-size="12">configured resolver</text>
