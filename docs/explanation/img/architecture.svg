<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" font-family="Inter,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">jailoc architecture</title>
<desc id="d">Host processes (jailoc CLI, vm-supervise, netbroker, go-microvm-runner with libkrun) with the image cache, and the workspace VM (guest kernel, jailoc-guest as PID 1, the coding agent, its processes and file systems), separated by the VM boundary that only virtio devices cross.</desc>
