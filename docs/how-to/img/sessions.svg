<text x="459" y="314" fill="#6E7180" font-size="12">jailoc-guest, owns the terminal</text>
<text x="459" y="334" fill="#464C54" font-size="12.5">replays terminal modes on attach</text>
<rect x="880" y="274" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="880" y="284" width="3" height="60" rx="1.5" fill="#2E7D32"/>
<text x="894" y="296" fill="#2E7D32" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">SSH server</text>
<text x="894" y="314" fill="#6E7180" font-size="12">jailoc-guest</text>
<text x="894" y="334" fill="#464C54" font-size="12.5">per-workspace key</text>
<path d="M1000 176 L1000 270" fill="none" stroke="#425CC7" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="1008" y="256" fill="#425CC7" font-size="11" font-weight="600">virtio-net</text>
<path d="M876 314 L791 314" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="833" y="306" fill="#6E7180" font-size="11" text-anchor="middle">attach</text>
<path d="M441 314 L356 314" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="398" y="306" fill="#6E7180" font-size="11" text-anchor="middle">pty</text>
</svg>
