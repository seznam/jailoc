<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" font-family="Inter,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How a session reaches the agent</title>
<desc id="d">jailoc on the host connects over SSH through a Unix socket that the network broker forwards into the VM. The SSH server in jailoc-guest uses a per-workspace key and a host key pinned at each start. A session holder in jailoc-guest owns the agent's terminal, so detaching or closing the terminal ends only the SSH connection while the agent keeps running. A second terminal takes the session over. Sessions live in VM memory and end when the VM stops.</desc>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9AA6B8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#425CC7"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D24E00"/></marker></defs>
<rect width="1200" height="392" fill="#FFFFFF" stroke="#DCE0E5" rx="8"/>
<text x="16" y="27" fill="#24292E" font-size="16" font-weight="700">Sessions · SSH in, the agent stays</text>
<text x="1184" y="27" fill="#8250DF" font-size="12" font-weight="700" text-anchor="end">agent</text>
<rect x="1131" y="18" width="9" height="9" rx="2" fill="#8250DF"/>
<text x="1114.0" y="27" fill="#2E7D32" font-size="12" font-weight="700" text-anchor="end">jailoc in the VM</text>
<rect x="982" y="18" width="9" height="9" rx="2" fill="#2E7D32"/>
<text x="964.8" y="27" fill="#D24E00" font-size="12" font-weight="700" text-anchor="end">jailoc on the host</text>
<rect x="818" y="18" width="9" height="9" rx="2" fill="#D24E00"/>
<rect x="8" y="44" width="1184" height="150" fill="#FFF1E6" rx="6"/>
<rect x="8" y="44" width="6" height="150" fill="#D24E00" rx="3"/>
<text x="26" y="61" fill="#D24E00" font-size="12" font-weight="800" letter-spacing="0.08em">HOST</text>
<rect x="30" y="84" width="360" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="94" width="3" height="70" rx="1.5" fill="#D24E00"/>
<text x="44" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc</text>
<text x="44" y="124" fill="#6E7180" font-size="12">your terminal</text>
<text x="44" y="144" fill="#464C54" font-size="12.5">Ctrl-b d detaches, a second terminal takes over</text>
<rect x="820" y="84" width="360" height="90" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="820" y="94" width="3" height="70" rx="1.5" fill="#D24E00"/>
<text x="834" y="106" fill="#D24E00" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">jailoc-netbroker</text>
<text x="834" y="124" fill="#6E7180" font-size="12">forwards a Unix socket</text>
<text x="834" y="144" fill="#464C54" font-size="12.5">into the VM, no published port</text>
<path d="M392 129 L814 129" fill="none" stroke="#9AA6B8" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="603" y="121" fill="#6E7180" font-size="11" text-anchor="middle">SSH, per-workspace key, pinned host key</text>
<line x1="8" y1="214" x2="1192" y2="214" stroke="#425CC7" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="548" y="204" width="103" height="20" rx="10" fill="#425CC7"/>
<text x="600" y="218" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">VM boundary</text>
<rect x="8" y="234" width="1184" height="140" fill="#EEF8EC" rx="6"/>
<rect x="8" y="234" width="6" height="140" fill="#2E7D32" rx="3"/>
<text x="26" y="251" fill="#2E7D32" font-size="12" font-weight="800" letter-spacing="0.08em">WORKSPACE VM · SESSIONS END WHEN THE VM STOPS</text>
<rect x="30" y="274" width="320" height="80" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="30" y="284" width="3" height="60" rx="1.5" fill="#8250DF"/>
<text x="44" y="296" fill="#8250DF" font-size="14" font-weight="700" font-family="JetBrains Mono,Menlo,monospace">coding agent</text>
<text x="44" y="314" fill="#6E7180" font-size="12">keeps working after detach</text>
<rect x="445" y="274" width="340" height="80" rx="6" fill="#FFFFFF" stroke="#DCE0E5"/>
<rect x="445" y="284" width="3" height="60" rx="1.5" fill="#2E7D32"/>
