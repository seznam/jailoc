name: Pre-release

# Cuts a release candidate from any ref without release-please: tags the
# ref as v<version> and publishes the GoReleaser artifacts as a GitHub
# pre-release. Stable versioning on main is not affected, and the update
# check ignores pre-releases.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release
        required: true
        default: main
      version:
        description: Pre-release version without the leading v (for example 1.20.0-rc.1)
        required: true

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate version and resolve ref
        id: resolve
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || {
            echo "version must look like 1.20.0-rc.1" >&2; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists" >&2; exit 1
          fi
          # Pin the commit so the runtime build and the release use the same source.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  vm-runtime:
    name: VM runtime
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/vm-runtime.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  goreleaser:
    name: GoReleaser
    needs: [validate, vm-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
      SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/runtime
      - name: Place VM runtimes for embedding
        run: |
          for dir in "$RUNNER_TEMP"/runtime/runtime-*; do
            mv "$dir"/*.tar.gz "internal/vm/runtimebin/${dir##*/runtime-}/"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-notices
          path: build/vm-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-source
          path: build/vm-runtime
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      # Tag only once every input is in place, so a failed build leaves no tag behind.
      - name: Create tag
        run: |
          git tag "v${VERSION}" "$SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$SHA" >/dev/null
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --verbose --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Release notes
        run: |
          gh release edit "v${VERSION}" --prerelease --latest=false \
            --notes "Release candidate built from \`${REF}\` (${SHA::7}). Not for general use; the update check does not offer pre-releases."
