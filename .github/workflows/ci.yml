name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  tui-plugin-sync:
    name: TUI Plugin Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: diff dist/tui.js internal/embed/assets/tui.js

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      OPENCODE_SERVER_PASSWORD: integration-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run integration tests
        if: startsWith(github.head_ref || '', 'release-please--branches--')
        run: go test -tags=integration -v -timeout 10m ./internal/...

  judge-commits:
    name: git-judge-commits
    runs-on: ubuntu-latest
    # Needs a secret, and a secret is only there for a branch pushed to this
    # repository: a fork's token cannot read one, and Dependabot's is restricted
    # to its own scope. Neither can be judged, so neither is attempted -- and a
    # dependency bump is not the kind of commit worth spending a judgement on.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write # it edits its own comment rather than adding another
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: git-judge-commits
        uses: thejoeejoee/git-judge-commits@86c725121ef08ceb16d8be17bbb1d5854f01c3b5 # v0.3.1
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          exclude: dist/tui.js,internal/embed/assets/tui.js
