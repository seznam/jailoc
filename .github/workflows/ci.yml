name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - run: go test ./...

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  tui-plugin-sync:
    name: TUI Plugin Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: node --test plugin/*.test.mjs
      - run: npm run build
      - run: diff dist/tui-opencode1.js internal/embed/assets/tui-opencode1.js
      - run: diff dist/tui-opencode2.js internal/embed/assets/tui-opencode2.js

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c
          enable-cache: false
      - name: Install dependencies
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --no-install-project --no-build --python 3.12
      - name: Build docs
        env:
          JAILOC_DOCS_VERSION: v0.0.0-ci
        run: uv run --no-sync zensical build --clean --strict

  judge-commits:
    name: git-judge-commits
    runs-on: ubuntu-latest
    # Needs a secret, and a secret is only there for a branch pushed to this
    # repository: a fork's token cannot read one, and Dependabot's is restricted
    # to its own scope. Neither can be judged, so neither is attempted -- and a
    # dependency bump is not the kind of commit worth spending a judgement on.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write # it edits its own comment rather than adding another
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: git-judge-commits
        uses: thejoeejoee/git-judge-commits@86c725121ef08ceb16d8be17bbb1d5854f01c3b5 # v0.3.1
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          exclude: dist/tui-opencode1.js,dist/tui-opencode2.js,internal/embed/assets/tui-opencode1.js,internal/embed/assets/tui-opencode2.js
