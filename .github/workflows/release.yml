name: Re-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v1.3.0)"
        required: true

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vm-runtime:
    name: VM runtime
    permissions:
      contents: read
    uses: ./.github/workflows/vm-runtime.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  goreleaser:
    name: GoReleaser
    needs: vm-runtime
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_DEPLOY_KEY lives in this environment, limited to main and v* tags.
    environment: homebrew-tap
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/runtime
      - name: Place VM runtimes for embedding
        run: |
          for dir in "$RUNNER_TEMP"/runtime/runtime-*; do
            mv "$dir"/*.tar.gz "internal/vm/runtimebin/${dir##*/runtime-}/"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-notices
          path: build/vm-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-source
          path: build/vm-runtime
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --verbose --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
