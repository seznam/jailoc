name: Release

on:
  push:
    branches: [main]

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs-build:
    name: Docs Build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c
          enable-cache: false
      - name: Install dependencies
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --no-install-project --no-build --python 3.12
      - name: Build docs
        env:
          JAILOC_DOCS_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: uv run --no-sync zensical build --clean --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  docs-deploy:
    name: Docs Deploy
    needs: [release-please, goreleaser, docs-build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  vm-runtime:
    name: VM runtime
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/vm-runtime.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  goreleaser:
    name: GoReleaser
    needs: [release-please, vm-runtime]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      # Recheck after acquiring the per-tag lock in case another run already
      # published this tag.
      - name: Check that the release is not published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1); then
            [[ "$out" == true ]] || { echo "release $TAG is already published" >&2; exit 1; }
          elif [[ "$out" != "release not found" ]]; then
            echo "$out" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/runtime
      - name: Place VM runtimes for embedding
        run: |
          for dir in "$RUNNER_TEMP"/runtime/runtime-*; do
            mv "$dir"/*.tar.gz "internal/vm/runtimebin/${dir##*/runtime-}/"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-notices
          path: build/vm-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-runtime-source
          path: build/vm-runtime
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Install GoReleaser
        env:
          GORELEASER_VERSION: v2.20.3
          GORELEASER_SHA256: a36d5d7d07a5e538e052cef2a9f93f1cd4af493cf5a3712b9177c1ebe360f0e7
        run: |
          curl -fsSLo "$RUNNER_TEMP/goreleaser.tar.gz" "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  $RUNNER_TEMP/goreleaser.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/goreleaser"
          tar -xzf "$RUNNER_TEMP/goreleaser.tar.gz" -C "$RUNNER_TEMP/goreleaser" goreleaser
          echo "$RUNNER_TEMP/goreleaser" >> "$GITHUB_PATH"
      - name: GoReleaser
        run: goreleaser release --verbose --draft --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/jailoc.rb
          if-no-files-found: error
      # The release stays a draft until every asset is attested; publishing
      # makes it immutable.
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  homebrew-tap:
    name: Homebrew tap
    needs: [release-please, goreleaser]
    # Tags such as v1.20.0-rc.1 do not update the tap.
    if: ${{ needs.goreleaser.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    # HOMEBREW_TAP_DEPLOY_KEY lives in this environment, limited to main and v* tags.
    environment: homebrew-tap
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-cask
          path: ${{ runner.temp }}/cask
      - name: Push cask to seznam/homebrew-tap
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/deploy-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -F /dev/null"
          git clone --depth 1 git@github.com:seznam/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          incoming="${TAG#v}"
          if [[ -f Casks/jailoc.rb ]]; then
            current=$(sed -n 's/^[[:space:]]*version "\([^"]*\)"/\1/p;T;q' Casks/jailoc.rb)
            if [[ -n "$current" && "$current" != "$incoming" ]] && \
               [[ "$(printf '%s\n%s\n' "$current" "$incoming" | sort -V | tail -n1)" == "$current" ]]; then
              echo "tap already has newer version $current (skipping $incoming)"
              exit 0
            fi
          fi
          cp "$RUNNER_TEMP/cask/jailoc.rb" Casks/jailoc.rb
          if git diff --quiet; then
            echo "Casks/jailoc.rb is already up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "chore(jailoc): update to $TAG"
          git push origin HEAD
