name: Update Nix vendorHash

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: nix-vendor-hash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  calculate:
    name: Calculate and verify vendorHash
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.user.login == 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      vendor-hash: ${{ steps.hash.outputs.vendor-hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Update vendor hash
        run: nix develop .#ci --command nix-update --flake --version=skip jailoc
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Format flake
        if: steps.diff.outputs.changed == 'true'
        run: nix fmt .
      - name: Verify flake
        if: steps.diff.outputs.changed == 'true'
        run: nix flake check
      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: nix build
      - name: Verify run
        if: steps.diff.outputs.changed == 'true'
        run: nix run . -- --help
      - name: Read updated vendor hash
        if: steps.diff.outputs.changed == 'true'
        id: hash
        run: |
          hash=$(nix eval --raw .#jailoc.vendorHash)
          [[ "$hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]
          echo "vendor-hash=$hash" >> "$GITHUB_OUTPUT"

  # A fresh runner keeps PR execution away from the publication token.
  publish:
    name: Publish vendorHash
    needs: calculate
    if: >-
      needs.calculate.outputs.changed == 'true'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.user.login == 'dependabot[bot]'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Apply vendor hash
        env:
          VENDOR_HASH: ${{ needs.calculate.outputs.vendor-hash }}
        run: |
          if [[ ! "$VENDOR_HASH" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "Expected a SHA-256 vendor hash" >&2
            exit 1
          fi
          if [[ ! -f flake.nix || -L flake.nix ]]; then
            echo "Expected flake.nix to be a regular file, not a symlink" >&2
            exit 1
          fi

          current_vendor_hash=$(grep '^[[:blank:]]*vendorHash = "' flake.nix | cut -d '"' -f 2)
          if [[ ! "$current_vendor_hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "Expected exactly one existing SHA-256 vendor hash" >&2
            exit 1
          fi

          sed -i "/^[[:blank:]]*vendorHash = /s|${current_vendor_hash}|${VENDOR_HASH}|" flake.nix
      - name: Update Dependabot branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet -- flake.nix; then
            exit 0
          fi
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --only \
            -m 'chore(nix): update vendorHash [dependabot skip]' -- flake.nix
          # Compare-and-swap against the original PR head: rejects the push if the branch
          # advanced or was deleted (e.g. PR closed/superseded) while `calculate` ran.
          git -c core.hooksPath=/dev/null push \
            --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" \
            origin "HEAD:refs/heads/$HEAD_BRANCH"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          token: ${{ github.token }}
          base: main
          add-paths: flake.nix
          branch: chore/nix-vendor-hash-update
          commit-message: "chore(nix): update vendorHash"
          title: "chore(nix): update vendorHash"
          body: "Automated vendorHash update after go.mod/go.sum changes."
