name: VM runtime

# Builds the VM runtime tarballs that release builds of jailoc embed
# (internal/vm/runtime.go), the corresponding source of libkrunfw
# (vm-runtime-source) and the runtime's third-party notices
# (vm-runtime-notices). Release workflows call this workflow, place each
# runtime-<platform> artifact in internal/vm/runtimebin/<platform> and the
# other two in build/vm-runtime before GoReleaser runs. Pull requests that
# change the build run it as a check without uploading artifacts.
#
# The runner is built from the go-microvm revision that go.mod pins. On macOS,
# libkrun comes from the go-microvm release in GO_MICROVM_RELEASE and libkrunfw
# is built from its pinned prebuilt kernel bundle; on Linux, go-microvm's
# builder image provides libkrun and libkrunfw at the versions that revision
# pins.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build the runtime from
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/vm-runtime.yml
      - scripts/vm-runtime/**

permissions:
  contents: read

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # go-microvm release that provides libkrun for darwin-arm64.
  GO_MICROVM_RELEASE: v0.0.41

jobs:
  darwin-arm64:
    name: Build darwin-arm64 runtime
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve go-microvm revision
        id: versions
        run: |
          read -r path version < <(go list -m -f '{{if .Replace}}{{.Replace.Path}} {{.Replace.Version}}{{else}}{{.Path}} {{.Version}}{{end}}' github.com/stacklok/go-microvm)
          echo "repo=${path}" >> "$GITHUB_OUTPUT"
          echo "rev=${version##*-}" >> "$GITHUB_OUTPUT"

      - name: Check out go-microvm
        env:
          REPO: ${{ steps.versions.outputs.repo }}
          REV: ${{ steps.versions.outputs.rev }}
        run: |
          git clone --quiet "https://${REPO}" "$RUNNER_TEMP/go-microvm"
          git -C "$RUNNER_TEMP/go-microvm" checkout --quiet "$REV"

      - name: Install libkrun and Task
        run: |
          brew tap slp/krun
          brew trust slp/krun
          brew install libkrun go-task

      - name: Build runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/vm-runtime/build-runtime-darwin.sh "$RUNNER_TEMP/go-microvm" "$GO_MICROVM_RELEASE" dist

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  linux:
    name: Build linux-${{ matrix.arch }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Resolve go-microvm revision
        id: versions
        run: |
          read -r path version < <(go list -m -f '{{if .Replace}}{{.Replace.Path}} {{.Replace.Version}}{{else}}{{.Path}} {{.Version}}{{end}}' github.com/stacklok/go-microvm)
          echo "repo=${path}" >> "$GITHUB_OUTPUT"
          echo "rev=${version##*-}" >> "$GITHUB_OUTPUT"

      - name: Check out go-microvm
        env:
          REPO: ${{ steps.versions.outputs.repo }}
          REV: ${{ steps.versions.outputs.rev }}
        run: |
          git clone --quiet "https://${REPO}" "$RUNNER_TEMP/go-microvm"
          git -C "$RUNNER_TEMP/go-microvm" checkout --quiet "$REV"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Build runtime
        run: scripts/vm-runtime/build-runtime-linux.sh "$RUNNER_TEMP/go-microvm" dist

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Collect libkrunfw source
        if: matrix.arch == 'amd64'
        run: scripts/vm-runtime/build-runtime-source.sh "$RUNNER_TEMP/go-microvm" source

      - if: matrix.arch == 'amd64' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-runtime-source
          path: source/vm-runtime-source.tar
          if-no-files-found: error

  notices:
    name: Collect runtime notices
    runs-on: ubuntu-24.04
    env:
      CARGO_ABOUT_VERSION: 0.9.3
      CARGO_ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Resolve go-microvm revision
        id: versions
        run: |
          read -r path version < <(go list -m -f '{{if .Replace}}{{.Replace.Path}} {{.Replace.Version}}{{else}}{{.Path}} {{.Version}}{{end}}' github.com/stacklok/go-microvm)
          echo "repo=${path}" >> "$GITHUB_OUTPUT"
          echo "rev=${version##*-}" >> "$GITHUB_OUTPUT"

      - name: Check out go-microvm
        env:
          REPO: ${{ steps.versions.outputs.repo }}
          REV: ${{ steps.versions.outputs.rev }}
        run: |
          git clone --quiet "https://${REPO}" "$RUNNER_TEMP/go-microvm"
          git -C "$RUNNER_TEMP/go-microvm" checkout --quiet "$REV"

      - name: Install cargo-about
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/$name.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-about" "$HOME/.cargo/bin/cargo-about"

      - name: Collect notices
        run: scripts/vm-runtime/build-runtime-notices.sh "$RUNNER_TEMP/go-microvm" notices

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-runtime-notices
          path: notices/vm-runtime-notices.txt
          if-no-files-found: error
