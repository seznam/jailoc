version: 2

project_name: jailoc

before:
  hooks:
    # Embed jailoc-guest (VM backend) for linux/arm64 and linux/amd64.
    - go generate ./internal/guestbin
    # The release workflows place the VM runtimes built by vm-runtime.yml
    # here; internal/vm embeds them.
    - sh -c 'for p in darwin-arm64 linux-amd64 linux-arm64; do for f in runtime firmware; do test -s internal/vm/runtimebin/$p/$f.tar.gz || { echo "missing VM runtime internal/vm/runtimebin/$p/$f.tar.gz" >&2; exit 1; }; done; done'

builds:
  - id: jailoc
    main: ./cmd/jailoc
    binary: jailoc
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # libkrun on macOS needs Apple silicon.
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: jailoc
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  disable: false
  draft: false
  # Tags such as v1.20.0-rc.1 become GitHub pre-releases.
  prerelease: auto
  mode: append
  use_existing_draft: true
  github:
    owner: seznam
    name: jailoc

snapshot:
  version_template: "{{ incpatch .Version }}-next"
