version: 2

project_name: jailoc

before:
  hooks:
    # Embed jailoc-guest (VM backend) for linux/arm64 and linux/amd64.
    - go generate ./internal/guestbin
    # The release workflows place the VM runtimes built by vm-runtime.yml
    # here; internal/vm embeds them.
    - sh -c 'for p in darwin-arm64 linux-amd64 linux-arm64; do for f in runtime firmware; do test -s internal/vm/runtimebin/$p/$f.tar.gz || { echo "missing VM runtime internal/vm/runtimebin/$p/$f.tar.gz" >&2; exit 1; }; done; done'
    # The release workflows also place the runtime's notices and the
    # corresponding source of libkrunfw in build/vm-runtime.
    - scripts/third-party-notices.sh build/vm-runtime/vm-runtime-notices.txt build/THIRD_PARTY_NOTICES
    - test -s build/vm-runtime/vm-runtime-source.tar

builds:
  - id: jailoc
    main: ./cmd/jailoc
    binary: jailoc
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # libkrun on macOS needs Apple silicon.
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: jailoc
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: build/THIRD_PARTY_NOTICES
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: build/vm-runtime/vm-runtime-source.tar
      name_template: "{{ .ProjectName }}_{{ .Version }}_vm-runtime-source.tar"

# SPDX SBOMs, generated by syft. An archive's SBOM lists the Go modules in
# jailoc. syft can't see into the embedded VM runtime, so each runtime gets its
# own SBOM with the Go modules of go-microvm-runner. syft can't detect libkrun
# and libkrunfw; THIRD_PARTY_NOTICES lists them.
sboms:
  - id: archive
    artifacts: archive
  - id: vm-runtime-darwin-arm64
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_vm-runtime_darwin_arm64.sbom.json"
    args: ["file:../internal/vm/runtimebin/darwin-arm64/runtime.tar.gz", "--output", "spdx-json=$document", "--enrich", "golang"]
  - id: vm-runtime-linux-amd64
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_vm-runtime_linux_amd64.sbom.json"
    args: ["file:../internal/vm/runtimebin/linux-amd64/runtime.tar.gz", "--output", "spdx-json=$document", "--enrich", "golang"]
  - id: vm-runtime-linux-arm64
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_vm-runtime_linux_arm64.sbom.json"
    args: ["file:../internal/vm/runtimebin/linux-arm64/runtime.tar.gz", "--output", "spdx-json=$document", "--enrich", "golang"]

changelog:
  disable: true

release:
  disable: false
  draft: false
  # Tags such as v1.20.0-rc.1 become GitHub pre-releases.
  prerelease: auto
  mode: append
  use_existing_draft: true
  # Complete corresponding source of the GPL-2.0-only kernel and the
  # LGPL-2.1-only library in libkrunfw, which the embedded VM runtime contains.
  extra_files:
    - glob: build/vm-runtime/vm-runtime-source.tar
      name_template: "{{ .ProjectName }}_{{ .Version }}_vm-runtime-source.tar"
  github:
    owner: seznam
    name: jailoc

snapshot:
  version_template: "{{ incpatch .Version }}-next"
